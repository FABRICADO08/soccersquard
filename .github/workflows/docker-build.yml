name: Build Docker Image from MPR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILDPACK_VERSION: v6.0.7

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Clone Mendix Docker Buildpack
      run: |
        git clone \
          --branch "$DOCKER_BUILDPACK_VERSION" \
          --depth 1 \
          --config core.autocrlf=false \
          https://github.com/mendix/docker-mendix-buildpack.git \
          /tmp/docker-mendix-buildpack

    - name: Compile Mendix project
      working-directory: /tmp/docker-mendix-buildpack
      run: |
        ./build.py \
          --source "$GITHUB_WORKSPACE" \
          --destination /tmp/mendix-docker-context \
          build-mda-dir

    - name: Build Mendix rootfs images
      working-directory: /tmp/docker-mendix-buildpack
      run: |
        docker build -t mendix-rootfs:app -f rootfs-app.dockerfile .
        docker build -t mendix-rootfs:builder -f rootfs-builder.dockerfile .

    - name: Set image name
      run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/soccersquad:latest" >> "$GITHUB_ENV"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker Image
      run: docker build -t "$IMAGE_NAME" /tmp/mendix-docker-context

    - name: Push Docker Image
      run: docker push "$IMAGE_NAME"
