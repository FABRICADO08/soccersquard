name: Build and Push Mendix Docker Image from MDA in release folder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Install unzip
      run: sudo apt-get update && sudo apt-get install unzip -y

    - name: Clone Mendix Docker Buildpack
      run: |
        git clone https://github.com/mendix/docker-mendix-buildpack.git
        mv docker-mendix-buildpack DockerBuildpack

    - name: Unzip MDA file from release folder
      run: |
       mkdir project              
              MDA_FILE=$(find . -type f -name "*.mda" | head -n 1)
              if [ -n "$MDA_FILE" ]; then
                unzip -o "$MDA_FILE" -d project
              else
                echo "Error: No .mda file found in the repository"
                exit 1
              fi

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build \
          --build-arg BUILD_PATH=./project \
          -f DockerBuildpack/Dockerfile \
          -t ${{ secrets.DOCKER_USERNAME }}/SoccerSquad:latest .

    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/SoccerSquad:latest
